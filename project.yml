name: Unshrimp
options:
  bundleIdPrefix: app.unshrimp
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Unshrimp:
    type: application
    platform: iOS
    sources:
      - path: Unshrimp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.unshrimp.prototype
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Unshrimp
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        CODE_SIGN_STYLE: Automatic
  UnshrimpUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UnshrimpUITests
    dependencies:
      - target: Unshrimp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.unshrimp.prototype.uitests
        TEST_TARGET_NAME: Unshrimp
        CODE_SIGN_STYLE: Automatic
schemes:
  Unshrimp:
    build:
      targets:
        Unshrimp: all
        UnshrimpUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UnshrimpUITests
